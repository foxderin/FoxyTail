name: foxytail
description: Android control application for the FoxyTail root module.
publish_to: none
version: 1.7.0+10700

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
