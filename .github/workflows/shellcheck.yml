name: Verify
on: [push, pull_request]
permissions:
  contents: read
# New commits supersede verification for the same branch/PR. Tags remain
# separate, and Release has its own unchanged workflow/concurrency policy.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - run: pnpm --dir webui install --frozen-lockfile
      - run: bash .github/tools/verify.sh
  native-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y iptables
      - name: Verify real DNS paths in an isolated Linux network
        env:
          FOXYTAIL_REQUIRE_PRIVILEGED_TESTS: '1'
        run: bash .github/tools/verify-native-linux.sh
