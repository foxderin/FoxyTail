name: Verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# A branch push and a release dispatch may arrive together. The second run
# checks for the first run's artifact after acquiring this exact-SHA slot.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: false
jobs:
  reuse:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.artifact.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Find a verified artifact from this exact source commit
        if: github.event_name != 'pull_request'
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(python3 .github/tools/verified-artifact.py find "$GITHUB_SHA")
          echo "run=$run" >> "$GITHUB_OUTPUT"
  verify:
    needs: reuse
    if: needs.reuse.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - run: pnpm --dir webui install --frozen-lockfile
      - run: bash .github/tools/verify.sh
  native-kernel:
    needs: reuse
    if: needs.reuse.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y iptables
      - name: Verify real DNS paths in an isolated Linux network
        env:
          FOXYTAIL_REQUIRE_PRIVILEGED_TESTS: '1'
        run: bash .github/tools/verify-native-linux.sh
  package:
    needs: [reuse, verify, native-kernel]
    if: github.event_name != 'pull_request' && needs.reuse.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y zip jq
      - name: Build once after both verification gates
        run: |
          bash .github/tools/build.sh
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          overwrite: true
