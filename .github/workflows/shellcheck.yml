name: Verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache-dependency-path: |
            native/*/go.mod
            native/*/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the Flutter SDK pin
        id: flutter-pin
        run: |
          source .github/tools/flutter-env.sh
          echo "version=$FOXYTAIL_FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$FOXYTAIL_FLUTTER_REVISION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          channel: stable
          cache: true
          cache-key: ${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.flutter-pin.outputs.revision }}-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ steps.flutter-pin.outputs.revision }}-${{ hashFiles('pubspec.lock') }}
      - name: Cache Gradle dependencies only
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-java21-gradle-deps-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-java21-gradle-deps-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq mksh
      - run: bash .github/tools/verify.sh
      - name: Reject generated changes to tracked sources
        run: test -z "$(git status --porcelain --untracked-files=no)"
  native-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache-dependency-path: |
            native/*/go.mod
            native/*/go.sum
      - run: sudo apt-get update && sudo apt-get install -y iptables
      - name: Verify real DNS paths in an isolated Linux network
        env:
          FOXYTAIL_REQUIRE_PRIVILEGED_TESTS: '1'
        run: bash .github/tools/verify-native-linux.sh
