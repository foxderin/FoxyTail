name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # .shellcheckrc (external-sources, SC2034) is picked up automatically.
      # Any finding at severity=warning or above fails the job.
      - name: Lint POSIX sh scripts
        run: |
          shopt -s nullglob
          files=(customize.sh service.sh uninstall.sh tailscale/settings.sh)
          for f in tailscale/scripts/*; do
            case "$f" in
              *.yaml) ;; # hev config template, not a shell script
              *) files+=("$f") ;;
            esac
          done
          printf 'checking: %s\n' "${files[@]}"
          shellcheck -s sh --severity=warning "${files[@]}"

      - name: Lint CI tools (bash)
        run: shellcheck -s bash --severity=warning .github/tools/*.sh
