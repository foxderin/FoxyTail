name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing, reviewed version tag to release (e.g. v1.0.3)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the existing release commit
        id: source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || exit 1
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$RELEASE_TAG" = "$(git show "refs/tags/$RELEASE_TAG:module.prop" | sed -n 's/^version=//p')"
          echo "sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Reuse or request exact-source verification and packaging
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          run=$(python3 .github/tools/verified-artifact.py ensure "$SOURCE_SHA" "$RELEASE_TAG")
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: verified-${{ steps.source.outputs.sha }}
          run-id: ${{ steps.verified.outputs.run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Check downloaded bytes and the release tag
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 .github/tools/verified-artifact.py check "$RELEASE_TAG" dist
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$SOURCE_SHA" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Publish the verified packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(inputs.tag || github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
