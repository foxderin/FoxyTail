name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.12.0)'
        required: true
        type: string
      commit_sha:
        description: 'Exact 40-character commit SHA (required for a new tag)'
        required: false
        type: string
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        name: Resolve immutable release source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          bash .github/tools/release-source.sh resolve
  checks:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache-dependency-path: |
            native/*/go.mod
            native/*/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - name: Cache Gradle dependencies only
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-java21-gradle-deps-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-java21-gradle-deps-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq mksh
      - run: bash .github/tools/verify.sh checks
  # Timing-sensitive shell suites get a dedicated runner: sharing a CPU with
  # the compile checks starved subprocess deadlines and caused real failures.
  backend:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache-dependency-path: |
            native/*/go.mod
            native/*/go.sum
      - run: sudo apt-get update && sudo apt-get install -y jq mksh
      - run: bash .github/tools/verify.sh backend
  native-kernel:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache-dependency-path: |
            native/*/go.mod
            native/*/go.sum
      - run: sudo apt-get update && sudo apt-get install -y iptables
      - name: Verify real DNS paths in an isolated Linux network
        env:
          FOXYTAIL_REQUIRE_PRIVILEGED_TESTS: '1'
        run: bash .github/tools/verify-native-linux.sh
  release:
    needs: [resolve, checks, backend, native-kernel]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Check immutable release source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "$(sed -n 's/^version=//p' module.prop)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/foxydns/go.mod
          cache-dependency-path: |
            native/*/go.mod
            native/*/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - name: Cache Gradle dependencies only
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-java21-gradle-deps-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-java21-gradle-deps-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - run: sudo apt-get update && sudo apt-get install -y zip jq
      - name: Build the module packages and companion APK
        env:
          FOXYTAIL_KEYSTORE_BASE64: ${{ secrets.FOXYTAIL_KEYSTORE_BASE64 }}
          FOXYTAIL_KEYSTORE_PASSWORD: ${{ secrets.FOXYTAIL_KEYSTORE_PASSWORD }}
          FOXYTAIL_KEY_ALIAS: ${{ secrets.FOXYTAIL_KEY_ALIAS }}
          FOXYTAIL_KEY_PASSWORD: ${{ secrets.FOXYTAIL_KEY_PASSWORD }}
        run: |
          export FOXYTAIL_KEYSTORE_PATH="$RUNNER_TEMP/foxytail-companion.p12"
          trap 'rm -f "$FOXYTAIL_KEYSTORE_PATH"' EXIT
          test -n "$FOXYTAIL_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$FOXYTAIL_KEYSTORE_BASE64" | base64 --decode > "$FOXYTAIL_KEYSTORE_PATH"
          unset FOXYTAIL_KEYSTORE_BASE64
          bash .github/tools/build.sh
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Create or verify tag after successful checks and signed build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          # Build must yield real artifacts before creating any release tag.
          test -s "dist/FoxyTail-${RELEASE_TAG}.apk"
          test -s "dist/FoxyTail-${RELEASE_TAG}.zip"
          test -s "dist/FoxyTail-${RELEASE_TAG}-full.zip"
          (cd dist && sha256sum -c SHA256SUMS)
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          else
            rc=$?
            test "$rc" = 2
            git push origin "$RELEASE_SHA:refs/tags/$RELEASE_TAG"
          fi
      - name: Publish the verified packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          files: |
            dist/*.zip
            dist/*.apk
            dist/*-daemon-*.tgz
            dist/daemon-build.txt
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(inputs.tag || github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
