name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing, reviewed version tag to release (e.g. v1.0.3)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the existing release commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || exit 1
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$RELEASE_TAG" = "$(sed -n 's/^version=//p' module.prop)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y zip jq shellcheck
      - run: pnpm --dir webui install --frozen-lockfile
      - name: Verify sources and committed WebUI
        run: bash .github/tools/verify.sh
      - name: Build from the reviewed manifest
        run: |
          bash .github/tools/build.sh
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish the existing tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(inputs.tag || github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
