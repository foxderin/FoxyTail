plugins { id 'com.android.application' }

def moduleVersion = new Properties()
rootProject.file('../module.prop').withInputStream { moduleVersion.load(it) }
def signingValues = ['FOXYTAIL_KEYSTORE_PATH', 'FOXYTAIL_KEYSTORE_PASSWORD', 'FOXYTAIL_KEY_ALIAS', 'FOXYTAIL_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = signingValues.values().every { it != null && !it.isEmpty() }

abstract class BuildWebUi extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def webDir = rootProject.file('../webui')
def webAssets = layout.buildDirectory.dir('generated/webAssets')
def installWebUi = tasks.register('installWebUi', Exec) {
    workingDir webDir
    commandLine 'pnpm', 'install', '--frozen-lockfile'
    inputs.files(new File(webDir, 'package.json'), new File(webDir, 'pnpm-lock.yaml'), new File(webDir, 'pnpm-workspace.yaml'))
    outputs.file(new File(webDir, 'node_modules/.modules.yaml'))
}
def buildWebUi = tasks.register('buildWebUi', BuildWebUi) {
    dependsOn installWebUi
    workingDir webDir
    commandLine 'pnpm', 'run', 'build'
    inputs.dir(new File(webDir, 'src'))
    inputs.files(new File(webDir, 'index.html'), new File(webDir, 'vite.config.ts'), new File(webDir, 'tsconfig.json'), new File(webDir, 'pnpm-lock.yaml'))
    outputDirectory.set(webAssets)
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(buildWebUi) { task -> task.outputDirectory }
    }
}

android {
    namespace 'dev.foxderin.tail'
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'dev.foxderin.tail'
        minSdk 26
        targetSdk 36
        versionCode moduleVersion.getProperty('versionCode').toInteger()
        versionName moduleVersion.getProperty('version').replaceFirst('^v', '')
        testInstrumentationRunner 'dev.foxderin.tail.BridgeInstrumentation'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingValues.FOXYTAIL_KEYSTORE_PATH)
                storePassword signingValues.FOXYTAIL_KEYSTORE_PASSWORD
                keyAlias signingValues.FOXYTAIL_KEY_ALIAS
                keyPassword signingValues.FOXYTAIL_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.webkit:webkit:1.18.0'
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') } && !hasReleaseSigning) {
        throw new GradleException('Release signing requires FOXYTAIL_KEYSTORE_PATH, FOXYTAIL_KEYSTORE_PASSWORD, FOXYTAIL_KEY_ALIAS and FOXYTAIL_KEY_PASSWORD; unsigned release artifacts are forbidden.')
    }
}
