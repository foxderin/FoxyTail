# FoxyTail main configuration.
# Parsed as data by every FoxyTail script via settings.sh load_conf().
# Default values are maintained in settings.sh load_conf(); entries here
# override them.
# Assignments only: KEY=value, no spaces around '='.

# Run mode:
#   bridge - userspace tailscaled + socks5 + hev-socks5-tunnel -> tailscale0 (default)
#   tun    - native tailscaled TUN (requires /dev/net/tun)
#   proxy  - socks5 only, no interface is created
TS_MODE=bridge

# Local socks5 proxy port exposed by tailscaled (bridge/proxy modes).
# Range 1024-65535; must not collide with other proxies on the device.
SOCKS_PORT=1099

# Port the MagicDNS dnsmasq resolver listens on (only used when MAGIC_DNS=on).
# Range 1024-65535; 53 redirect is coexistence-aware.
DNS_PORT=1053

# MagicDNS: resolve tailnet hostnames via dnsmasq split-DNS to 100.100.100.100.
# on|off
MAGIC_DNS=off

# IPv6: permit dual-stack tailscale0 and symmetric ip6tables rules.
# Requires an IPv6 CIDR in routes.conf ROUTE_SUBNETS; no subnet is added implicitly.
# on|off (default off)
IPV6=off

# Dedicated policy routing table number; the main table is never touched.
# Range 1000-65535; system tables are forbidden. Must be unused by other modules.
ROUTE_TABLE=1052

# Reserved mark bit; masked writes preserve Android and Tailscale mark bits.
# Keep this bit unused by other VPN/firewall modules on the device.
FWMARK=0x40000000
FWMARK_MASK=0x40000000

# Watchdog: restart tailscaled on crash, rebind on network change.
# on|off
WATCHDOG=on

# Watchdog check interval in seconds. Lower = faster recovery, more wakeups.
# Range 5-300.
WATCHDOG_INTERVAL=30

# Traffic stats collection interval in seconds (screen on; auto-degraded when
# the screen is off to save power). Range 10-3600.
STATS_INTERVAL=60

# Maximum size of the runtime log in KB before rotation to .bak (one backup
# kept). Range 64-10240.
LOG_MAX_KB=512
