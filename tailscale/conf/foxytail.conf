# FoxyTail main configuration.
# Parsed as data by every FoxyTail script via settings.sh load_conf().
# Default values are maintained in scripts/foxytail.config.sh; entries here
# override them.
# Assignments only: KEY=value, no spaces around '='.

# Run mode:
#   bridge - userspace tailscaled + socks5 + hev-socks5-tunnel -> tailscale0 (default)
#   tun    - native tailscaled TUN (requires /dev/net/tun)
#   proxy  - socks5 only, no interface is created
TS_MODE=bridge

# Local socks5 proxy port exposed by tailscaled (bridge/proxy modes).
# Range 1024-65535; must not collide with other proxies on the device.
SOCKS_PORT=1099

# Local MagicDNS listener port (only used when MAGIC_DNS=on).
# Range 1024-65535; choose a port unused by other VPNs or local resolvers.
DNS_PORT=1053

# MagicDNS: resolve names in the active Tailnet.
# on|off
MAGIC_DNS=off

# legacy: dnsmasq with current Android DNS, requiring safe owned conntrack capture.
# local: Tailnet-only loopback endpoint for any resolver with split-DNS support.
# hijack: queue UDP/53 by name; only MagicDNS full/short names are answered
# (injected from the original resolver's address), all other packets pass
# through untouched. No conntrack, mark or NAT is needed.
# transparent: capture plain DNS when kernel/original socket context permits;
# otherwise expose the local endpoint. Reserves mark bit 0x20000000.
# New modes temporarily disable native accept-dns for the current profile and
# restore its prior value on stop. They do not replace corporate split DNS.
DNS_MODE=legacy

# IPv6: permit dual-stack tailscale0 and symmetric ip6tables rules.
# Requires an IPv6 CIDR in routes.conf ROUTE_SUBNETS; no subnet is added implicitly.
# on|off (default off)
IPV6=off

# Dedicated policy routing table number; the main table is never touched.
# Fixed at 1052; foreign resources block application. Never use the main table.
ROUTE_TABLE=1052

# Reserved mark bit; masked writes preserve Android and Tailscale mark bits.
# Keep this bit unused by other VPN/firewall modules on the device.
FWMARK=0x40000000
FWMARK_MASK=0x40000000

# Power saving: slower optional monitoring, no active network-change pings.
# Does not stop Tailscale or disable DNS safety checks. on|off
POWER_SAVE=off

# Independently enable traffic sampling and network-context automation.
# Turning either off preserves history / rules. on|off
STATS=on
CONTEXT=on

# Auto-refresh visible Android pages; retain the existing on-disk key. on|off
WEBUI_AUTO_REFRESH=on

# Watchdog: restart tailscaled on crash, rebind on network change.
# on|off
WATCHDOG=on

# Active Tailnet probes after network changes (also paused in power-save mode).
# Crash recovery remains controlled by WATCHDOG. on|off
WATCHDOG_PROBE=on

# Watchdog check interval in seconds. Lower = faster recovery, more wakeups.
# Range 5-300. Power saving: at least 60s awake / 180s screen off.
WATCHDOG_INTERVAL=30

# Watchdog recovery limits. Restarts inside WATCHDOG_RESTART_WINDOW seconds are
# counted; at WATCHDOG_RESTART_LIMIT the watchdog cools down for
# WATCHDOG_COOLDOWN seconds. WATCHDOG_BACKEND_BAD_LIMIT consecutive rounds with
# an unanswered daemon trigger a restart. Ranges: 1-100, 60-86400, 10-3600,
# 1-100.
WATCHDOG_RESTART_LIMIT=5
WATCHDOG_RESTART_WINDOW=600
WATCHDOG_COOLDOWN=300
WATCHDOG_BACKEND_BAD_LIMIT=3

# Traffic stats collection interval in seconds (screen on; auto-degraded when
# the screen is off to save power). Range 10-3600.
# Power saving: at least 300s awake / 900s screen off.
STATS_INTERVAL=60

# Traffic samples older than this many days are pruned. Range 1-3650.
STATS_RETENTION_DAYS=7

# Network context check interval in seconds. Range 5-3600.
# Power saving: at least 60s awake / 180s screen off.
CONTEXT_INTERVAL=20

# Maximum size of the runtime log in KB before rotation to .bak (one backup
# kept). Range 64-10240.
LOG_MAX_KB=512
