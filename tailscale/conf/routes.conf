# FoxyTail routing configuration.
# Sourced by settings.sh load_conf() after foxytail.conf.
# POSIX sh syntax only: KEY=value, no spaces around '='.

# Route scope:
#   all      - route all traffic through FoxyTail (subject to ROUTE_SUBNETS)
#   selected - only UIDs in UID_LIST are routed
#   bypass   - everything is routed EXCEPT UIDs in UID_LIST
ROUTE_SCOPE=all

# Space-separated list of app UIDs for selected/bypass scopes.
# Example: UID_LIST="10123 10204"
UID_LIST=""

# Space-separated CIDRs routed through the tunnel.
# Default covers the Tailscale CGNAT range.
# IPv6 example (requires IPV6=on in foxytail.conf), uncomment to enable:
# ROUTE_SUBNETS="100.64.0.0/10 fd7a:115c:a1e0::/48"
ROUTE_SUBNETS="100.64.0.0/10"
