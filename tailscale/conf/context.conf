# FoxyTail network-context rules (foxytail.context).
#
# One rule per line:
#   <trigger>:<value>:<action>[:<arg>]
#
# trigger:
#   ssid      - current Wi-Fi SSID equals <value>
#   cellular  - mobile data is active (<value> is ignored, use "-")
#
# action:
#   up           - bring the tunnel up
#   down         - bring the tunnel down
#   exit-node    - use exit node <arg>
#   no-exit-node - clear the exit node
#
# Examples (uncomment to enable):
# ssid:HomeWifi:down
# ssid:Office:exit-node:myserver
# cellular:-:no-exit-node
