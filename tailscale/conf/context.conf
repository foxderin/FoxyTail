# FoxyTail network-context rules (foxytail.context).
#
# One rule per line:
#   <trigger>:<value>:<action>[:<arg>]
# Blank lines and whole-line comments are allowed (including indentation).
# Inline comments are not supported. SSIDs cannot contain ':', '#', double
# quotes or control characters; do not quote/escape them. Spaces, backslashes
# and UTF-8 names are literal. "unknown", "<unknown ssid>" and "<none>" are
# reserved for unavailable Wi-Fi information and cannot be matched.
# A final newline is optional. CRLF line endings are accepted.
# Validate before use: foxytail.context validate /path/to/context.conf
#
# trigger:
#   ssid      - current Wi-Fi SSID equals <value>
#   cellular  - mobile data is active (<value> must be "-")
#
# action:
#   up           - bring the tunnel up
#   down         - bring the tunnel down
#   exit-node    - use exit node <arg> (required node name or IPv4/IPv6 address)
#   no-exit-node - clear the exit node
# Only exit-node takes an argument; the other actions require three fields.
#
# Examples (uncomment to enable):
# ssid:HomeWifi:down
# ssid:Office:exit-node:myserver
# cellular:-:no-exit-node
