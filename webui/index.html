<!DOCTYPE html>
<html lang="zh" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#f5f6f8">
  <title>FoxyTail</title>
  <style>
    :root { --md-sys-color-background: #f5f6f8; --md-sys-color-on-background: #18212f; --boot-surface: #fff; --boot-line: #e5e9ef; color-scheme: light; }
    :root[data-theme-effective="dark"] { --md-sys-color-background: #15181e; --md-sys-color-on-background: #e7eaf0; --boot-surface: #1d222b; --boot-line: #333d4b; color-scheme: dark; }
    /* System dark fallback for the boot frame: no script in head (CSP 'self'), theme.ts re-paints after native bootstrap. */
    @media (prefers-color-scheme: dark) { :root[data-theme="auto"] { --md-sys-color-background: #15181e; --md-sys-color-on-background: #e7eaf0; --boot-surface: #1d222b; --boot-line: #333d4b; color-scheme: dark; } }
    html, body { margin: 0; background: var(--md-sys-color-background); color: var(--md-sys-color-on-background); }
    #boot-screen { padding: calc(20px + env(safe-area-inset-top)) 20px; font: 14px system-ui, sans-serif; max-width: 780px; margin: auto; }
    #boot-screen strong { font-size: 22px; letter-spacing: -.5px; }
    #boot-screen strong::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 10px; border-radius: 4px; background: #e76b3c; }
    #boot-screen p { opacity: .65; font-size: 12px; margin: 12px 0 28px; }
    .boot-panel { background: var(--boot-surface); border-radius: 16px; padding: 20px; margin-top: 16px; }
    .boot-line { height: 14px; background: var(--boot-line); border-radius: 7px; margin: 14px 0; }
    .boot-line:first-child { width: 36%; height: 22px; margin-bottom: 24px; }
    .boot-line:last-child { width: 70%; }
  </style>
</head>
<body>
  <div id="boot-screen" role="status" aria-live="polite"><strong>FoxyTail</strong><p>正在加载界面… / Loading…</p><div class="boot-panel" aria-hidden="true"><div class="boot-line"></div><div class="boot-line"></div><div class="boot-line"></div></div></div>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
